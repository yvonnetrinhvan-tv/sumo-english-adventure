name: Đưa trò chơi lên GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Chuẩn bị trang tĩnh
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r src data icons _site/
          sed -i "s/sumo-static-v1/sumo-static-${GITHUB_SHA}/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Xuất bản
        id: deployment
        uses: actions/deploy-pages@v4
